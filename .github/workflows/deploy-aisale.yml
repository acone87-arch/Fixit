name: Deploy aisale

on:
  push:
    branches: [codex/aisale-deploy]
    paths:
      - "aisale/**"
      - ".github/workflows/deploy-aisale.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aisale-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aisale-pilot
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify deployment host matches the public domain
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          python - <<'PY'
          import os
          import socket
          from ipaddress import ip_address

          host = os.environ["VPS_HOST"].strip()
          def ipv4_addresses(name):
              try:
                  return {item[4][0] for item in socket.getaddrinfo(name, None, socket.AF_INET)}
              except socket.gaierror:
                  try:
                      return {str(ip_address(name))}
                  except ValueError:
                      return set()

          deploy_addresses = ipv4_addresses(host)
          domain_addresses = ipv4_addresses("aisale.fixitpulse.ru")
          matches = bool(deploy_addresses & domain_addresses)
          print(f"VPS host resolves to the public aisale server: {matches}")
          if not matches:
              raise SystemExit("VPS_HOST and aisale.fixitpulse.ru resolve to different IPv4 addresses; refusing deployment.")
          PY

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          AISale_POSTGRES_PASSWORD: ${{ secrets.AISALE_POSTGRES_PASSWORD }}
          AISale_ADMIN_USERNAME: ${{ secrets.AISALE_ADMIN_USERNAME }}
          AISale_ADMIN_PASSWORD: ${{ secrets.AISALE_ADMIN_PASSWORD }}
          AISale_AI_API_KEY: ${{ secrets.AISALE_AI_API_KEY }}
          AISale_AI_PROJECT_ID: ${{ secrets.AISALE_AI_PROJECT_ID }}
          AISale_TELEGRAM_BOT_TOKEN: ${{ secrets.AISALE_TELEGRAM_BOT_TOKEN }}
          AISale_TELEGRAM_CHAT_ID: ${{ secrets.AISALE_TELEGRAM_CHAT_ID }}
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS AISale_POSTGRES_PASSWORD AISale_ADMIN_USERNAME AISale_ADMIN_PASSWORD AISale_AI_API_KEY AISale_AI_PROJECT_ID AISale_TELEGRAM_BOT_TOKEN AISale_TELEGRAM_CHAT_ID; do
            if [ -z "${!name}" ]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done
          case "$AISale_ADMIN_PASSWORD" in
            demo-change-me|change-this-before-pilot|admin|password)
              echo 'Set a unique production admin password in AISALE_ADMIN_PASSWORD before deploying.' >&2
              exit 1
              ;;
          esac

      - name: Prepare private app environment
        env:
          POSTGRES_PASSWORD: ${{ secrets.AISALE_POSTGRES_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.AISALE_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.AISALE_ADMIN_PASSWORD }}
          AI_API_KEY: ${{ secrets.AISALE_AI_API_KEY }}
          AI_PROJECT_ID: ${{ secrets.AISALE_AI_PROJECT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.AISALE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.AISALE_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          keys = ["POSTGRES_PASSWORD", "ADMIN_USERNAME", "ADMIN_PASSWORD", "AI_API_KEY", "AI_PROJECT_ID", "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID"]
          def quote(value):
              return '"' + value.replace("\\", "\\\\").replace('"', '\\"').replace("\n", "\\n") + '"'
          values = {key: os.environ[key] for key in keys}
          values.update({
              "COMPANY_NAME": "Тёплый балкон", "COMPANY_CITY": "Уфа", "COMPANY_PHONE": "",
              "SERVICE_AREA": "Уфа", "MEASUREMENT_DURATION_MINUTES": "60", "CURRENCY": "RUB",
              "WORKING_HOURS": "09:00-19:00", "BUSINESS_TIMEZONE": "Asia/Yekaterinburg",
              "DATA_RETENTION_DAYS": "180", "AI_BASE_URL": "https://ai.api.cloud.yandex.net/v1",
              "AI_MODEL": f"gpt://{os.environ['AI_PROJECT_ID']}/qwen3.6-35b-a3b",
              "AI_AUTH_SCHEME": "Api-Key", "APP_BASE_URL": "https://aisale.fixitpulse.ru",
              "LOCAL_STORAGE_PATH": "/app/uploads",
          })
          Path("aisale.runtime.env").write_text("".join(f"{key}={quote(value)}\n" for key, value in values.items()), encoding="utf-8")
          PY
          chmod 600 aisale.runtime.env

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Package isolated app source
        run: tar -czf aisale.source.tgz -C aisale .

      - name: Upload private environment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes aisale.runtime.env "$VPS_USER@$VPS_HOST:/tmp/aisale.env.$RELEASE_SHA"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes aisale.source.tgz "$VPS_USER@$VPS_HOST:/tmp/aisale.source.$RELEASE_SHA.tgz"
          rm -f aisale.runtime.env

      - name: Deploy isolated app and HTTPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "bash -s -- '$RELEASE_SHA'" <<'REMOTE'
          set -euo pipefail
          release_sha="$1"
          deploy_user="$(id -un)"
          deploy_group="$(id -gn)"
          sudo -n install -d -o "$deploy_user" -g "$deploy_group" -m 700 /opt/aisale
          tar -xzf "/tmp/aisale.source.$release_sha.tgz" -C /opt/aisale
          rm -f "/tmp/aisale.source.$release_sha.tgz"
          install -m 600 "/tmp/aisale.env.$release_sha" /opt/aisale/.env
          rm -f "/tmp/aisale.env.$release_sha"
          cd /opt/aisale

          docker compose --project-name aisale -f docker-compose.prod.yml build
          docker compose --project-name aisale -f docker-compose.prod.yml up -d --remove-orphans
          healthy=false
          for attempt in $(seq 1 30); do
            if docker compose --project-name aisale -f docker-compose.prod.yml exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()" >/dev/null 2>&1; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            docker compose --project-name aisale -f docker-compose.prod.yml logs --tail=100 backend frontend
            exit 1
          fi

          sudo -n install -d -m 755 /var/www/letsencrypt/.well-known/acme-challenge
          sudo -n install -m 644 deploy/aisale-http.conf /etc/nginx/sites-enabled/aisale.conf
          sudo -n nginx -t
          sudo -n systemctl reload nginx
          if ! sudo -n openssl x509 -in /etc/letsencrypt/live/aisale.fixitpulse.ru/fullchain.pem -noout -ext subjectAltName 2>/dev/null | grep -Fq 'DNS:aisale.fixitpulse.ru'; then
            echo 'Existing TLS certificate does not cover the AISale hostname; requesting a replacement.' >&2
            sudo -n certbot certonly --webroot -w /var/www/letsencrypt --non-interactive --agree-tos --register-unsafely-without-email --force-renewal --cert-name aisale.fixitpulse.ru -d aisale.fixitpulse.ru
          fi
          sudo -n openssl x509 -in /etc/letsencrypt/live/aisale.fixitpulse.ru/fullchain.pem -noout -ext subjectAltName
          if ! sudo -n openssl x509 -in /etc/letsencrypt/live/aisale.fixitpulse.ru/fullchain.pem -noout -ext subjectAltName 2>/dev/null | grep -Fq 'DNS:aisale.fixitpulse.ru'; then
            sudo -n certbot certificates
            echo 'The configured AISale certificate still does not cover the domain.' >&2
            exit 1
          fi
          sudo -n install -m 644 deploy/aisale-https.conf /etc/nginx/sites-enabled/aisale.conf
          sudo -n nginx -t
          sudo -n systemctl reload nginx
          if ! sudo -n nginx -T 2>&1 | grep -Fq 'server_name aisale.fixitpulse.ru;'; then
            echo 'The aisale virtual host is not present in the active Nginx configuration.' >&2
            exit 1
          fi
          echo 'The aisale virtual host is loaded by Nginx.'
          local_http_location="$(curl -sSI --noproxy '*' --connect-timeout 10 --max-time 20 --resolve aisale.fixitpulse.ru:80:127.0.0.1 http://aisale.fixitpulse.ru/ | awk 'tolower($1) == "location:" { print $2 }' | tr -d '\r')"
          echo "Local HTTP redirect target: ${local_http_location:-<none>}"
          curl -q -fsS --noproxy '*' --connect-timeout 10 --max-time 20 --resolve aisale.fixitpulse.ru:443:127.0.0.1 https://aisale.fixitpulse.ru/api/health >/dev/null
          REMOTE

      - name: Diagnose public routing from the deployment host
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo '--- Deployment host network ---' >&2
          hostname -f >&2
          ip -4 -brief address show scope global >&2
          printf 'Outbound public IPv4: ' >&2
          curl -4 -fsS --connect-timeout 5 --max-time 10 https://checkip.amazonaws.com 2>&1 | tr -d '\n' >&2
          echo >&2
          echo '--- Public HTTP response ---' >&2
          curl -sSI --noproxy '*' --connect-timeout 5 --max-time 10 http://aisale.fixitpulse.ru/ 2>&1 | sed -n '1,7p' >&2
          echo '--- Public TLS certificate ---' >&2
          printf '\n' | timeout 10 openssl s_client -servername aisale.fixitpulse.ru -connect aisale.fixitpulse.ru:443 2>/dev/null | openssl x509 -noout -subject -issuer -ext subjectAltName >&2
          echo '--- Active Nginx host names and listeners ---' >&2
          sudo -n nginx -T 2>/dev/null | grep -E 'server_name |listen .*443|ssl_certificate ' | head -n 60 >&2
          echo '--- Nginx sockets ---' >&2
          sudo -n ss -ltnp '( sport = :80 or sport = :443 )' >&2
          echo '--- AISale virtual-host block ---' >&2
          sudo -n nginx -T 2>/dev/null | sed -n '/server_name aisale.fixitpulse.ru;/,+18p' | sed -E 's/aisale\.fixitpulse\.ru/[AISale domain]/g' >&2
          echo '--- Certificate route comparison ---' >&2
          local_fp="$(printf '\n' | timeout 10 openssl s_client -servername aisale.fixitpulse.ru -connect 127.0.0.1:443 2>/dev/null | openssl x509 -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2)"
          public_fp="$(printf '\n' | timeout 10 openssl s_client -servername aisale.fixitpulse.ru -connect aisale.fixitpulse.ru:443 2>/dev/null | openssl x509 -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2)"
          echo "Loopback certificate fingerprint present: $([ -n "$local_fp" ] && echo yes || echo no)" >&2
          echo "Public route certificate fingerprint present: $([ -n "$public_fp" ] && echo yes || echo no)" >&2
          echo "Public route serves the AISale certificate: $([ -n "$local_fp" ] && [ "$local_fp" = "$public_fp" ] && echo yes || echo no)" >&2
          dns_ip="$(getent ahostsv4 aisale.fixitpulse.ru | awk 'NR == 1 { print $1 }')"
          egress_ip="$(curl -4 -fsS --connect-timeout 5 --max-time 10 https://checkip.amazonaws.com | tr -d '\r\n')"
          echo "Server DNS A record equals its public egress IP: $([ -n "$dns_ip" ] && [ "$dns_ip" = "$egress_ip" ] && echo yes || echo no)" >&2
          if grep -Eq '(^|[[:space:]])aisale\.fixitpulse\.ru([[:space:]]|$)' /etc/hosts; then
            echo 'Server /etc/hosts overrides AISale DNS: yes' >&2
          else
            echo 'Server /etc/hosts overrides AISale DNS: no' >&2
          fi
          if sudo -n openssl x509 -in /etc/letsencrypt/live/aisale.fixitpulse.ru/fullchain.pem -noout -ext subjectAltName 2>/dev/null | grep -Fq 'DNS:aisale.fixitpulse.ru'; then
            echo 'Installed AISale certificate contains its DNS name: yes' >&2
          else
            echo 'Installed AISale certificate contains its DNS name: no' >&2
          fi
          REMOTE

      - name: Diagnose public DNS and client routes
        continue-on-error: true
        run: |
          python - <<'PY'
          import socket
          host = "aisale.fixitpulse.ru"
          for family, label in ((socket.AF_INET, "A/IPv4"), (socket.AF_INET6, "AAAA/IPv6")):
              try:
                  values = sorted({item[4][0] for item in socket.getaddrinfo(host, 443, family, socket.SOCK_STREAM)})
              except socket.gaierror:
                  values = []
              print(f"Public DNS {label}: {', '.join(values) if values else '<no record>'}")
          PY
          set +e
          for family in -4 -6; do
            echo "--- External TLS route $family ---"
            curl "$family" -sv --connect-timeout 8 --max-time 12 https://aisale.fixitpulse.ru/api/health -o /dev/null 2>&1 | grep -E 'Trying |Connected to |subjectAltName|SSL certificate|certificate|curl: \('
          done

      - name: Verify public HTTPS
        run: |
          curl -q -fsS --connect-timeout 10 --max-time 20 https://aisale.fixitpulse.ru/api/health
          curl -q -fsS --connect-timeout 10 --max-time 20 https://aisale.fixitpulse.ru/ >/dev/null
