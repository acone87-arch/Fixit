name: Deploy aisale

on:
  push:
    branches: [codex/aisale-deploy]
    paths:
      - "aisale/**"
      - ".github/workflows/deploy-aisale.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aisale-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aisale-pilot
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify deployment host matches the public domain
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          python - <<'PY'
          import os
          import socket
          from ipaddress import ip_address

          host = os.environ["VPS_HOST"].strip()
          def ipv4_addresses(name):
              try:
                  return {item[4][0] for item in socket.getaddrinfo(name, None, socket.AF_INET)}
              except socket.gaierror:
                  try:
                      return {str(ip_address(name))}
                  except ValueError:
                      return set()

          deploy_addresses = ipv4_addresses(host)
          domain_addresses = ipv4_addresses("aisale.fixitpulse.ru")
          matches = sorted(deploy_addresses & domain_addresses)
          print(f"VPS and public domain share an IPv4 address: {bool(matches)}")
          print(f"Public domain has {len(domain_addresses)} IPv4 address(es)")
          if not matches:
              raise SystemExit("VPS_HOST and aisale.fixitpulse.ru resolve to different IPv4 addresses; refusing deployment.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"AISALE_DEPLOY_IP={matches[0]}\n")
          PY

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          AISale_POSTGRES_PASSWORD: ${{ secrets.AISALE_POSTGRES_PASSWORD }}
          AISale_ADMIN_USERNAME: ${{ secrets.AISALE_ADMIN_USERNAME }}
          AISale_ADMIN_PASSWORD: ${{ secrets.AISALE_ADMIN_PASSWORD }}
          AISale_AI_API_KEY: ${{ secrets.AISALE_AI_API_KEY }}
          AISale_AI_PROJECT_ID: ${{ secrets.AISALE_AI_PROJECT_ID }}
          AISale_TELEGRAM_BOT_TOKEN: ${{ secrets.AISALE_TELEGRAM_BOT_TOKEN }}
          AISale_TELEGRAM_CHAT_ID: ${{ secrets.AISALE_TELEGRAM_CHAT_ID }}
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS AISale_POSTGRES_PASSWORD AISale_ADMIN_USERNAME AISale_ADMIN_PASSWORD AISale_AI_API_KEY AISale_AI_PROJECT_ID AISale_TELEGRAM_BOT_TOKEN AISale_TELEGRAM_CHAT_ID; do
            if [ -z "${!name}" ]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done
          case "$AISale_ADMIN_PASSWORD" in
            demo-change-me|change-this-before-pilot|admin|password)
              echo 'Set a unique production admin password in AISALE_ADMIN_PASSWORD before deploying.' >&2
              exit 1
              ;;
          esac

      - name: Prepare private app environment
        env:
          POSTGRES_PASSWORD: ${{ secrets.AISALE_POSTGRES_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.AISALE_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.AISALE_ADMIN_PASSWORD }}
          AI_API_KEY: ${{ secrets.AISALE_AI_API_KEY }}
          AI_PROJECT_ID: ${{ secrets.AISALE_AI_PROJECT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.AISALE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.AISALE_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          keys = ["POSTGRES_PASSWORD", "ADMIN_USERNAME", "ADMIN_PASSWORD", "AI_API_KEY", "AI_PROJECT_ID", "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID"]
          def quote(value):
              return '"' + value.replace("\\", "\\\\").replace('"', '\\"').replace("\n", "\\n") + '"'
          values = {key: os.environ[key] for key in keys}
          values.update({
              "COMPANY_NAME": "Тёплый балкон", "COMPANY_CITY": "Уфа", "COMPANY_PHONE": "",
              "SERVICE_AREA": "Уфа", "MEASUREMENT_DURATION_MINUTES": "60", "CURRENCY": "RUB",
              "WORKING_HOURS": "09:00-19:00", "BUSINESS_TIMEZONE": "Asia/Yekaterinburg",
              "DATA_RETENTION_DAYS": "180", "AI_BASE_URL": "https://ai.api.cloud.yandex.net/v1",
              "AI_MODEL": f"gpt://{os.environ['AI_PROJECT_ID']}/qwen3.6-35b-a3b",
              "AI_AUTH_SCHEME": "Api-Key", "APP_BASE_URL": "https://aisale.fixitpulse.ru",
              "LOCAL_STORAGE_PATH": "/app/uploads",
          })
          Path("aisale.runtime.env").write_text("".join(f"{key}={quote(value)}\n" for key, value in values.items()), encoding="utf-8")
          PY
          chmod 600 aisale.runtime.env

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Run backend tests without production credentials
        run: |
          docker build --file aisale/backend/Dockerfile --tag aisale-backend-check ./aisale/backend
          docker run --rm -e AI_API_KEY= -e TELEGRAM_BOT_TOKEN= -e TELEGRAM_CHAT_ID= aisale-backend-check python -m pytest tests -q

      - name: Package isolated app source
        run: tar -czf aisale.source.tgz -C aisale .

      - name: Upload private environment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o "HostKeyAlias=$VPS_HOST" aisale.runtime.env "$VPS_USER@$AISALE_DEPLOY_IP:/tmp/aisale.env.$RELEASE_SHA"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o "HostKeyAlias=$VPS_HOST" aisale.source.tgz "$VPS_USER@$AISALE_DEPLOY_IP:/tmp/aisale.source.$RELEASE_SHA.tgz"
          rm -f aisale.runtime.env

      - name: Deploy isolated app and HTTPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "HostKeyAlias=$VPS_HOST" "$VPS_USER@$AISALE_DEPLOY_IP" "bash -s -- '$RELEASE_SHA' '$AISALE_DEPLOY_IP'" <<'REMOTE'
          set -euo pipefail
          release_sha="$1"
          public_ipv4="$2"
          if [[ ! "$public_ipv4" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo 'The resolved AISale public address is not IPv4.' >&2
            exit 1
          fi
          deploy_user="$(id -un)"
          deploy_group="$(id -gn)"
          sudo -n install -d -o "$deploy_user" -g "$deploy_group" -m 700 /opt/aisale
          tar -xzf "/tmp/aisale.source.$release_sha.tgz" -C /opt/aisale
          rm -f "/tmp/aisale.source.$release_sha.tgz"
          install -m 600 "/tmp/aisale.env.$release_sha" /opt/aisale/.env
          rm -f "/tmp/aisale.env.$release_sha"
          cd /opt/aisale

          docker compose --project-name aisale -f docker-compose.prod.yml build
          docker compose --project-name aisale -f docker-compose.prod.yml up -d --remove-orphans
          healthy=false
          for attempt in $(seq 1 30); do
            if docker compose --project-name aisale -f docker-compose.prod.yml exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()" >/dev/null 2>&1; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            docker compose --project-name aisale -f docker-compose.prod.yml logs --tail=100 backend frontend
            exit 1
          fi

          REMOTE

      - name: Configure AISale HTTPS vhost
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "HostKeyAlias=$VPS_HOST" "$VPS_USER@$AISALE_DEPLOY_IP" "bash -s -- '$AISALE_DEPLOY_IP'" <<'REMOTE'
          set -euo pipefail
          public_ipv4="$1"
          cd /opt/aisale
          sudo -n install -d -m 755 /var/www/letsencrypt/.well-known/acme-challenge
          sed "s/__AISale_PUBLIC_IPV4__/$public_ipv4/g" deploy/aisale-http.conf | sudo -n tee /etc/nginx/sites-enabled/aisale.conf >/dev/null
          sudo -n chmod 644 /etc/nginx/sites-enabled/aisale.conf
          sudo -n rm -f /etc/nginx/conf.d/aisale.conf
          sudo -n nginx -t
          sudo -n systemctl reload nginx
          cert_path=/etc/letsencrypt/live/aisale-fixitpulse-dns
          if ! sudo -n openssl x509 -in "$cert_path/fullchain.pem" -noout -ext subjectAltName 2>/dev/null | grep -Fq 'DNS:aisale.fixitpulse.ru'; then
            echo 'Requesting a dedicated TLS certificate for aisale.fixitpulse.ru.' >&2
            sudo -n certbot certonly --webroot -w /var/www/letsencrypt --non-interactive --agree-tos --register-unsafely-without-email --cert-name aisale-fixitpulse-dns -d aisale.fixitpulse.ru
          fi
          sudo -n openssl x509 -in "$cert_path/fullchain.pem" -noout -ext subjectAltName
          if ! sudo -n openssl x509 -in "$cert_path/fullchain.pem" -noout -ext subjectAltName 2>/dev/null | grep -Fq 'DNS:aisale.fixitpulse.ru'; then
            sudo -n certbot certificates
            echo 'The configured AISale certificate still does not cover the domain.' >&2
            exit 1
          fi
          sed "s/__AISale_PUBLIC_IPV4__/$public_ipv4/g" deploy/aisale-https.conf | sudo -n tee /etc/nginx/sites-enabled/aisale.conf >/dev/null
          sudo -n chmod 644 /etc/nginx/sites-enabled/aisale.conf
          sudo -n nginx -t
          sudo -n systemctl reload nginx
          sudo -n nginx -T 2>&1 | grep -E '^[[:space:]]*(listen .*(:80|:443)|server_name |ssl_certificate )' | tail -n 80
          if curl -q -fsS --noproxy '*' --connect-timeout 10 --max-time 20 --resolve "aisale.fixitpulse.ru:443:$public_ipv4" https://aisale.fixitpulse.ru/api/health; then
            echo 'AISale is reachable through the VPS public IPv4 listener.'
          else
            echo 'The VPS cannot hairpin to its public IPv4; external verification will determine public reachability.'
          fi
          REMOTE

      - name: Inspect VPS TLS routing
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "HostKeyAlias=$VPS_HOST" "$VPS_USER@$AISALE_DEPLOY_IP" "bash -s -- '$AISALE_DEPLOY_IP'" <<'REMOTE'
          set -euo pipefail
          public_ipv4="$1"
          echo '=== Host listeners ==='
          sudo -n ss -ltnp '( sport = :80 or sport = :443 )'
          echo '=== Active Nginx virtual hosts ==='
          sudo -n nginx -T 2>&1 | grep -E '^[[:space:]]*(listen .*(:80|:443)|server_name |ssl_certificate )' | tail -n 80
          echo '=== Nginx include paths and AISale files ==='
          sudo -n grep -nE '^[[:space:]]*include ' /etc/nginx/nginx.conf || true
          sudo -n ls -la /etc/nginx/conf.d /etc/nginx/sites-enabled || true
          sudo -n sed -n '1,100p' /etc/nginx/conf.d/aisale.conf || true
          echo '=== Configured AISale certificate ==='
          if sudo -n test -f /etc/letsencrypt/live/aisale-fixitpulse-dns/fullchain.pem; then
            sudo -n openssl x509 -in /etc/letsencrypt/live/aisale-fixitpulse-dns/fullchain.pem -noout -subject -issuer -fingerprint -sha256 -ext subjectAltName
          else
            echo 'The expected AISale TLS certificate file does not exist.'
          fi
          echo '=== Certificate selected on loopback ==='
          timeout 10 openssl s_client -connect 127.0.0.1:443 -servername aisale.fixitpulse.ru </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -fingerprint -sha256 -ext subjectAltName || true
          echo '=== Certificate selected on VPS public address ==='
          timeout 10 openssl s_client -connect "$public_ipv4:443" -servername aisale.fixitpulse.ru </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -fingerprint -sha256 -ext subjectAltName || true
          REMOTE

      - name: Verify public HTTPS
        run: |
          echo 'Certificate presented by the public AISale endpoint:'
          timeout 10 openssl s_client -connect aisale.fixitpulse.ru:443 -servername aisale.fixitpulse.ru -showcerts </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -fingerprint -sha256 -ext subjectAltName
          curl -q -fsS --connect-timeout 10 --max-time 20 https://aisale.fixitpulse.ru/api/health
          curl -q -fsS --connect-timeout 10 --max-time 20 https://aisale.fixitpulse.ru/ >/dev/null
