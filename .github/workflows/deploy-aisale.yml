name: Deploy aisale

on:
  push:
    branches: [main]
    paths:
      - "aisale/**"
      - ".github/workflows/deploy-aisale.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aisale-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          AISale_POSTGRES_PASSWORD: ${{ secrets.AISALE_POSTGRES_PASSWORD }}
          AISale_ADMIN_USERNAME: ${{ secrets.AISALE_ADMIN_USERNAME }}
          AISale_ADMIN_PASSWORD: ${{ secrets.AISALE_ADMIN_PASSWORD }}
          AISale_AI_API_KEY: ${{ secrets.AISALE_AI_API_KEY }}
          AISale_AI_PROJECT_ID: ${{ secrets.AISALE_AI_PROJECT_ID }}
          AISale_TELEGRAM_BOT_TOKEN: ${{ secrets.AISALE_TELEGRAM_BOT_TOKEN }}
          AISale_TELEGRAM_CHAT_ID: ${{ secrets.AISALE_TELEGRAM_CHAT_ID }}
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS AISale_POSTGRES_PASSWORD AISale_ADMIN_USERNAME AISale_ADMIN_PASSWORD AISale_AI_API_KEY AISale_AI_PROJECT_ID AISale_TELEGRAM_BOT_TOKEN AISale_TELEGRAM_CHAT_ID; do
            if [ -z "${!name}" ]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done
          case "$AISale_ADMIN_PASSWORD" in
            demo-change-me|change-this-before-pilot|admin|password)
              echo 'Set a unique production admin password in AISALE_ADMIN_PASSWORD before deploying.' >&2
              exit 1
              ;;
          esac

      - name: Prepare private app environment
        env:
          POSTGRES_PASSWORD: ${{ secrets.AISALE_POSTGRES_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.AISALE_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.AISALE_ADMIN_PASSWORD }}
          AI_API_KEY: ${{ secrets.AISALE_AI_API_KEY }}
          AI_PROJECT_ID: ${{ secrets.AISALE_AI_PROJECT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.AISALE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.AISALE_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          keys = ["POSTGRES_PASSWORD", "ADMIN_USERNAME", "ADMIN_PASSWORD", "AI_API_KEY", "AI_PROJECT_ID", "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID"]
          def quote(value):
              return '"' + value.replace("\\", "\\\\").replace('"', '\\"').replace("\n", "\\n") + '"'
          values = {key: os.environ[key] for key in keys}
          values.update({
              "COMPANY_NAME": "Тёплый балкон", "COMPANY_CITY": "Уфа", "COMPANY_PHONE": "",
              "SERVICE_AREA": "Уфа", "MEASUREMENT_DURATION_MINUTES": "60", "CURRENCY": "RUB",
              "WORKING_HOURS": "09:00-19:00", "BUSINESS_TIMEZONE": "Asia/Yekaterinburg",
              "DATA_RETENTION_DAYS": "180", "AI_BASE_URL": "https://ai.api.cloud.yandex.net/v1",
              "AI_MODEL": f"gpt://{os.environ['AI_PROJECT_ID']}/qwen3.6-35b-a3b",
              "AI_AUTH_SCHEME": "Api-Key", "APP_BASE_URL": "https://aisale.fixitpulse.ru",
              "LOCAL_STORAGE_PATH": "/app/uploads",
          })
          Path("aisale.runtime.env").write_text("".join(f"{key}={quote(value)}\n" for key, value in values.items()), encoding="utf-8")
          PY
          chmod 600 aisale.runtime.env

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload private environment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes aisale.runtime.env "$VPS_USER@$VPS_HOST:/tmp/aisale.env.$RELEASE_SHA"
          rm -f aisale.runtime.env

      - name: Deploy isolated app and HTTPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "bash -s -- '$RELEASE_SHA'" <<'REMOTE'
          set -euo pipefail
          release_sha="$1"
          cd /opt/fixit
          git fetch origin "$release_sha"
          git archive "$release_sha" aisale | tar -x -C /opt/fixit
          install -d -m 700 /opt/fixit/aisale
          install -m 600 "/tmp/aisale.env.$release_sha" /opt/fixit/aisale/.env
          rm -f "/tmp/aisale.env.$release_sha"
          cd /opt/fixit/aisale

          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          healthy=false
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()" >/dev/null 2>&1; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            docker compose -f docker-compose.prod.yml logs --tail=100 backend frontend
            exit 1
          fi

          sudo -n install -d -m 755 /var/www/letsencrypt/.well-known/acme-challenge
          sudo -n install -m 644 deploy/aisale-http.conf /etc/nginx/sites-enabled/aisale.conf
          sudo -n nginx -t
          sudo -n systemctl reload nginx
          if [ ! -s /etc/letsencrypt/live/aisale.fixitpulse.ru/fullchain.pem ]; then
            sudo -n certbot certonly --webroot -w /var/www/letsencrypt --non-interactive --agree-tos --register-unsafely-without-email -d aisale.fixitpulse.ru
          fi
          sudo -n install -m 644 deploy/aisale-https.conf /etc/nginx/sites-enabled/aisale.conf
          sudo -n nginx -t
          sudo -n systemctl reload nginx
          curl -fsS --noproxy '*' --connect-timeout 10 --max-time 20 --resolve aisale.fixitpulse.ru:443:127.0.0.1 https://aisale.fixitpulse.ru/api/health >/dev/null
          REMOTE

      - name: Verify public HTTPS
        run: |
          curl -fsS --connect-timeout 10 --max-time 20 https://aisale.fixitpulse.ru/api/health
          curl -fsS --connect-timeout 10 --max-time 20 https://aisale.fixitpulse.ru/ >/dev/null
