name: Inspect VPS for Fixit Pulse domain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Inspect web-server prerequisites
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          printf 'sudo_noninteractive='
          if sudo -n true 2>/dev/null; then echo yes; else echo no; fi
          printf 'nginx_config_check='
          if sudo -n nginx -t >/dev/null 2>&1; then echo ok; else echo unavailable_or_invalid; fi
          printf 'certbot='
          if command -v certbot >/dev/null 2>&1; then echo installed; else echo absent; fi
          printf 'existing_host_response='
          curl -sS -o /dev/null -w '%{http_code}\n' -H 'Host: fixitpulse.ru' http://127.0.0.1 || true
          REMOTE
