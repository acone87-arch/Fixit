name: Deploy to VPS

on:
  push:
    branches: [main, codex/pilot-release-p0-5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pilot
          POSTGRES_PASSWORD: pilot-ci-only
          POSTGRES_DB: fixit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilot -d fixit_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+asyncpg://pilot:pilot-ci-only@127.0.0.1:5432/fixit_test
      FIXIT_TEST_DATABASE_URL: postgresql+asyncpg://pilot:pilot-ci-only@127.0.0.1:5432/fixit_test
      FIXIT_RUN_BROWSER: '1'
      SECRET_KEY: isolated-release-ci-secret
      PUBLIC_APP_URL: http://127.0.0.1:8765
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      ALLOWED_ORIGINS: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.txt playwright==1.55.0
          python -m playwright install --with-deps chromium
          npm ci --prefix tests --ignore-scripts
          npx --prefix tests playwright install --with-deps chromium
      - name: Run Python, PostgreSQL and browser acceptance
        run: pytest -q --junitxml=test-results/release.xml
      - name: Run JS runtime acceptance
        run: |
          node tests/onboarding_equipment_runtime_test.js
          node tests/pulse_offline_engine_runtime_test.js
          node tests/technician_workflow_runtime_test.js
          node tests/offline_attachment_sync_runtime_test.js
          node tests/guest_photo_upload_runtime_test.js
      - name: Run real IndexedDB and service worker acceptance
        run: node tests/durable_queue_browser_test.js
      - name: Restore a real PostgreSQL and media backup in isolation
        run: bash scripts/ci_backup_restore_drill.sh
      - name: Save release acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-${{ github.sha }}
          path: test-results/
          retention-days: 14

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          FIXIT_GIT_DEPLOY_KEY: ${{ secrets.FIXIT_GIT_DEPLOY_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS FIXIT_GIT_DEPLOY_KEY VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT; do
            if [ -z "${!name}" ]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Update production
        env:
          RELEASE_SHA: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          FIXIT_GIT_DEPLOY_KEY: ${{ secrets.FIXIT_GIT_DEPLOY_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" 'bash -se' <<REMOTE
          set -euo pipefail
          cd /opt/fixit
          install -d -m 700 ~/.ssh
          printf '%s\n' "$FIXIT_GIT_DEPLOY_KEY" > ~/.ssh/fixit_github_ed25519
          chmod 600 ~/.ssh/fixit_github_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git config core.sshCommand 'ssh -i ~/.ssh/fixit_github_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes'
          git remote set-url origin git@github.com:acone87-arch/Fixit.git
          upsert_env() {
            local key="\$1" value="\$2"
            if grep -q "^\${key}=" .env; then
              sed -i "s|^\${key}=.*|\${key}=\${value}|" .env
            else
              printf '\n%s=%s\n' "\$key" "\$value" >> .env
            fi
          }
          upsert_env VAPID_PUBLIC_KEY "$VAPID_PUBLIC_KEY"
          upsert_env VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"
          upsert_env VAPID_SUBJECT "$VAPID_SUBJECT"
          # Preserve the legacy origin as a full application host while making
          # Fixit Pulse canonical only for newly generated public links.
          current_public_app_url="\$(sed -n 's/^PUBLIC_APP_URL=//p' .env | tail -n 1)"
          legacy_host="\$(sudo -n nginx -T 2>/dev/null | awk '\$1 == "server_name" && \$2 != "fixitpulse.ru" && \$2 != "www.fixitpulse.ru" && !found { gsub(";", "", \$2); value = \$2; found = 1 } END { print value }')"
          if [ -z "\$legacy_host" ]; then
            echo 'Could not determine legacy host from active nginx configuration' >&2
            exit 1
          fi
          legacy_origin="https://\$legacy_host"
          echo "Previous PUBLIC_APP_URL: \${current_public_app_url:-<unset>}"
          upsert_env ALLOWED_ORIGINS "\$legacy_origin,https://fixitpulse.ru"
          upsert_env ALLOWED_HOSTS "\$legacy_host,fixitpulse.ru,localhost,127.0.0.1"
          upsert_env PUBLIC_APP_URL "https://fixitpulse.ru"
          echo "Dual-origin legacy origin: \$legacy_origin"
          echo 'PUBLIC_APP_URL: https://fixitpulse.ru'
          echo "ALLOWED_ORIGINS: \$legacy_origin,https://fixitpulse.ru"
          echo "ALLOWED_HOSTS: \$legacy_host,fixitpulse.ru,localhost,127.0.0.1"
          git fetch origin "$RELEASE_SHA"
          release_script="\$(mktemp /tmp/fixit-release.XXXXXX)"
          trap 'rm -f "\$release_script"' EXIT
          git show "$RELEASE_SHA:scripts/deploy_pilot_release.sh" > "\$release_script"
          chmod 700 "\$release_script"
          bash "\$release_script" "$RELEASE_SHA"
          rm -f "\$release_script"
          trap - EXIT

          healthy=false
          for attempt in \$(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "\$healthy" != true ]; then
            docker compose -f docker-compose.prod.yml logs --tail=100 api
            exit 1
          fi

          # Both origins remain independent full application origins.  Do not
          # introduce a canonical redirect in this dual-origin phase.
          sudo -n rm -f /etc/nginx/conf.d/fixitpulse.conf
          sudo -n install -m 644 deploy/fixitpulse-https.conf /etc/nginx/sites-enabled/fixitpulse.conf
          sudo -n nginx -t
          sudo -n systemctl reload nginx

          if systemctl list-unit-files certbot.timer --no-legend 2>/dev/null | grep -q '^certbot.timer'; then
            sudo -n systemctl enable --now certbot.timer
            echo "certbot.timer: \$(systemctl is-active certbot.timer)"
          elif systemctl list-unit-files snap.certbot.renew.timer --no-legend 2>/dev/null | grep -q '^snap.certbot.renew.timer'; then
            sudo -n systemctl enable --now snap.certbot.renew.timer
            echo "snap.certbot.renew.timer: \$(systemctl is-active snap.certbot.renew.timer)"
          elif [ -f /etc/cron.d/certbot ]; then
            echo 'certbot.timer: not installed; using existing /etc/cron.d/certbot scheduler'
          else
            echo 'No existing Certbot renewal scheduler was found' >&2
            systemctl list-timers --all --no-pager | grep -Ei 'certbot|letsencrypt' || true
            exit 1
          fi
          sudo -n install -d -m 755 /etc/letsencrypt/renewal-hooks/deploy
          printf '%s\n' '#!/bin/sh' 'nginx -t && systemctl reload nginx' | sudo -n tee /etc/letsencrypt/renewal-hooks/deploy/reload-nginx >/dev/null
          sudo -n chmod 755 /etc/letsencrypt/renewal-hooks/deploy/reload-nginx
          if [ ! -f /opt/fixit/.certbot-renew-dry-run-ok ]; then
            sudo -n certbot renew --dry-run
            sudo -n touch /opt/fixit/.certbot-renew-dry-run-ok
          fi

          # --resolve sends real SNI and validates the issued certificate; no
          # insecure -k bypass is permitted.
          curl -fsS --noproxy '*' --connect-timeout 10 --max-time 20 \
            --resolve fixitpulse.ru:443:127.0.0.1 https://fixitpulse.ru/health >/dev/null
          REMOTE
      - name: Verify HTTPS multipart limits
        run: |
          truncate -s 2M /tmp/fixit-accepted-upload.bin
          truncate -s 10M /tmp/fixit-rejected-upload.bin
          endpoint="https://fixitpulse.ru/api/public/equipment/00000000-0000-0000-0000-000000000001/requests/00000000-0000-0000-0000-000000000002/attachments"
          accepted_status=$(curl -sS -o /dev/null -w '%{http_code}' -F file=@/tmp/fixit-accepted-upload.bin "$endpoint")
          rejected_status=$(curl -sS -o /dev/null -w '%{http_code}' -F file=@/tmp/fixit-rejected-upload.bin "$endpoint")
          test "$accepted_status" = 404
          test "$rejected_status" = 413
