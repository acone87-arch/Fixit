name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          FIXIT_GIT_DEPLOY_KEY: ${{ secrets.FIXIT_GIT_DEPLOY_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS FIXIT_GIT_DEPLOY_KEY VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT; do
            if [ -z "${!name}" ]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Update production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          FIXIT_GIT_DEPLOY_KEY: ${{ secrets.FIXIT_GIT_DEPLOY_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" 'bash -se' <<REMOTE
          set -euo pipefail
          cd /opt/fixit
          install -d -m 700 ~/.ssh
          printf '%s\n' "$FIXIT_GIT_DEPLOY_KEY" > ~/.ssh/fixit_github_ed25519
          chmod 600 ~/.ssh/fixit_github_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git config core.sshCommand 'ssh -i ~/.ssh/fixit_github_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes'
          git remote set-url origin git@github.com:acone87-arch/Fixit.git
          upsert_env() {
            local key="\$1" value="\$2"
            if grep -q "^\${key}=" .env; then
              sed -i "s|^\${key}=.*|\${key}=\${value}|" .env
            else
              printf '\n%s=%s\n' "\$key" "\$value" >> .env
            fi
          }
          upsert_env VAPID_PUBLIC_KEY "$VAPID_PUBLIC_KEY"
          upsert_env VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"
          upsert_env VAPID_SUBJECT "$VAPID_SUBJECT"
          git pull --ff-only origin main
          docker compose -f docker-compose.prod.yml build api
          docker compose -f docker-compose.prod.yml run --rm -T api alembic upgrade head </dev/null
          docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate api

          healthy=false
          for attempt in \$(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "\$healthy" != true ]; then
            docker compose -f docker-compose.prod.yml logs --tail=100 api
            exit 1
          fi

          # Keep the new hostname isolated from the existing IP-based vhost.
          # TLS is configured in a separate step after public DNS resolves.
          sudo -n install -d -m 755 /var/www/letsencrypt
          sudo -n install -m 644 deploy/fixitpulse-http.conf /etc/nginx/conf.d/fixitpulse.conf
          sudo -n nginx -t
          sudo -n systemctl reload nginx
          curl -fsS -H 'Host: fixitpulse.ru' http://127.0.0.1:80/health >/dev/null

          # The root A record is live before this step. Keep registration local
          # to the VPS so no contact address is stored in GitHub.
          sudo -n certbot certonly --webroot -w /var/www/letsencrypt \
            --non-interactive --agree-tos --register-unsafely-without-email \
            --keep-until-expiring -d fixitpulse.ru
          sudo -n install -m 644 deploy/fixitpulse-https.conf /etc/nginx/conf.d/fixitpulse.conf
          sudo -n nginx -t
          sudo -n systemctl reload nginx
          curl -fsS --resolve fixitpulse.ru:443:127.0.0.1 https://fixitpulse.ru/health >/dev/null
          REMOTE
