<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#081511">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fixit">
<title>Fixit Pulse — сервисная платформа</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/fixit-192.svg">
<link rel="stylesheet" href="/static/styles.css?v=20260904-4">
</head>
<body>

<div id="toast-root"></div>

<!-- Экран входа -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="login-brand"><span class="pulse-logo-dot"></span><strong>FIXIT</strong><em>PULSE</em></div>
    <div class="display">Сервис под контролем</div>
    <div class="subtitle">Операционная платформа для сервисного бизнеса</div>
    <div id="login-error" class="login-error hidden"></div>
    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" required autocomplete="username">
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Войти</button>
    </form>
    <div id="join-form-host"></div>
  </div>
</div>

<!-- Основное приложение -->
<div id="app" class="hidden">
  <div class="sidebar">
    <div class="brand"><span class="pulse-logo-dot"></span><strong>FIXIT</strong><em>PULSE</em></div>
    <div class="brand-caption">SERVICE OPERATIONS</div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <strong id="user-name">—</strong>
        <span id="user-role">—</span>
      </div>
      <button class="logout-btn" id="logout-btn">Выйти</button>
    </div>
  </div>
  <div class="main">
    <header class="app-topbar"><span>Сервисная платформа</span><div><i></i> Live operations</div></header>
    <header class="mobile-topbar">
      <div class="brand"><span class="pulse-logo-dot"></span><strong>FIXIT</strong><em>PULSE</em></div>
      <button class="mobile-profile" id="mobile-profile-btn" aria-label="Меню пользователя"><span></span></button>
    </header>
    <div id="content"></div>
  </div>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Основная навигация"></nav>
  <div class="more-menu hidden" id="more-menu"></div>
</div>

<script src="/static/offline/engine.js?v=20260902-1"></script>
<script src="/static/app.js?v=20260904-4"></script>
</body>
</html>
