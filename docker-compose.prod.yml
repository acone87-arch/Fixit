services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "80:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fsm:${POSTGRES_PASSWORD}@db:5432/fsm
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fsm
      POSTGRES_USER: fsm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsm -d fsm"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
