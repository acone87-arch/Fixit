<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Заявки · Тёплый балкон</title><style>body{font:15px system-ui;max-width:1000px;margin:32px auto;padding:16px;color:#203330}section,article{margin:20px 0}.tiles{display:flex;gap:10px;flex-wrap:wrap}.tile,.lead{background:#f2f5ef;padding:14px;border:1px solid #dce4db;border-radius:10px}.lead{background:white;margin:12px 0}button,input{font:inherit;padding:8px;border:1px solid #d4ddd4;border-radius:8px}button{background:#315c4e;color:#fff;cursor:pointer}input[type=number]{width:100px}.row{padding:9px;border-bottom:1px solid #ddd}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f7f2;padding:10px;border-radius:8px}.muted{color:#728078;font-size:12px}</style></head>
<body><h1>Заявки на замер</h1><section id="funnel"></section><section><h2>Заявки</h2><div id="leads"></div></section><section><h2>Демо-прайс · ₽</h2><div id="prices"></div></section><section><h2>Расписание · добавить свободный интервал</h2><form id="slotform"><label>Начало <input id="from" type="datetime-local" required></label> <label>Конец <input id="to" type="datetime-local" required></label> <button>Добавить слот</button></form><div id="slots"></div></section>
<script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
async function load(){const [fr,lr,pr,sr]=await Promise.all(["funnel","leads","prices","slots"].map(x=>fetch("/admin/api/"+x)));const [f,l,p,s]=await Promise.all([fr.json(),lr.json(),pr.json(),sr.json()]);document.querySelector("#funnel").innerHTML="<h2>Воронка</h2><div class=tiles>"+Object.entries(f).map(([k,v])=>`<div class=tile><b>${esc(v)}</b><br><small>${esc(k)}</small></div>`).join("")+"</div>";document.querySelector("#leads").innerHTML=l.map(x=>`<article class=lead><b>${esc(x.customer_name)}</b> · ${esc(x.phone)} · ${esc(x.channel)}<br>${esc(x.address)}<br>${esc(x.estimate_min)}–${esc(x.estimate_max)} ₽ · ${esc(x.appointment_at||"без записи")} · ${esc(x.photo_count)} фото <button data-delete="${esc(x.id)}">Удалить персональные данные</button><details><summary>Расчёт, фото и история</summary><p>${esc(x.vision_summary)}</p><div>${(x.photos||[]).map((url,i)=>`<a href="${esc(url)}" target="_blank" rel="noreferrer">Фото ${i+1}</a>`).join(" · ")}</div><h4>EstimateState</h4><pre>${esc(JSON.stringify(x.estimate_state,null,2))}</pre><h4>Диалог</h4><pre>${esc((x.messages||[]).map(m=>m.role+": "+m.text).join("\n"))}</pre></details></article>`).join("")||"<p class=muted>Заявок пока нет.</p>";document.querySelector("#prices").innerHTML=p.map(x=>`<div class=row><label>Позиция <input data-name="${esc(x.code)}" value="${esc(x.name)}"></label> <label>от <input data-min="${esc(x.code)}" type=number value="${esc(x.price_min)}"></label> <label>до <input data-max="${esc(x.code)}" type=number value="${esc(x.price_max)}"></label> <label><input data-enabled="${esc(x.code)}" type=checkbox ${x.enabled?"checked":""}> активна</label> <span class=muted>${x.demo?"DEMO":""}</span> <button data-save="${esc(x.code)}">Сохранить</button></div>`).join("");document.querySelector("#slots").innerHTML="<h3>Ближайшие слоты</h3>"+s.slice(0,30).map(x=>`<div>${esc(new Date(x.start_at).toLocaleString("ru-RU"))} · ${esc(x.status)}</div>`).join("")}
document.addEventListener("click",async e=>{const b=e.target.closest("button[data-save],button[data-delete]");if(!b)return;if(b.dataset.save){const c=b.dataset.save;await fetch("/admin/api/prices/"+encodeURIComponent(c),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.querySelector(`[data-name="${c}"]`).value,price_min:Number(document.querySelector(`[data-min="${c}"]`).value),price_max:Number(document.querySelector(`[data-max="${c}"]`).value),enabled:document.querySelector(`[data-enabled="${c}"]`).checked})});await load()}if(b.dataset.delete&&confirm("Удалить контакт, сообщения и фотографии заявки?")){await fetch("/admin/api/leads/"+encodeURIComponent(b.dataset.delete),{method:"DELETE"});await load()}});
document.querySelector("#slotform").addEventListener("submit",async e=>{e.preventDefault();await fetch("/admin/api/slots",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({start_at:new Date(document.querySelector("#from").value).toISOString(),end_at:new Date(document.querySelector("#to").value).toISOString()})});await load()});load();
</script></body></html>
