services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: measurer
      POSTGRES_USER: measurer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U measurer -d measurer"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://measurer:${POSTGRES_PASSWORD:-local-demo-password}@postgres:5432/measurer
    volumes:
      - photos:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  postgres_data:
  photos:
